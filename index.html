<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login Demo</title>
<style>
body {
  background: #fafafa;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 90vh;
}
.box {
  background: white;
  border: 1px solid #ddd;
  padding: 30px 25px;
  width: 300px;
  text-align: center;
  border-radius: 8px;
}
h1 {
  font-size: 35px;
}
input {
  width: 100%;
  box-sizing: border-box;
  padding: 14px;
  margin-bottom: 12px;
  border: 1px solid #ddd;
}
button {
  width: 100%;
  padding: 13px;
  background: #3897f0;
  color: white;
  border: none;
  border-radius: 5px;
  font-size: 16px;
}
#result {
  display: none;
  color: red;
  font-size: 28px;
  font-weight: bold;
}
#captured {
  display: none;
  margin-top: 15px;
  font-size: 12px;
  color: #666;
  text-align: left;
  word-break: break-all;
}
</style>
</head>
<body>

<div class="box" id="login">
  <h1>LOGIN</h1>
  <input id="username" placeholder="Enter username">
  <input id="password" type="password" placeholder="Enter password">
  <button onclick="showResult()">Continue</button>
  <p>Demo Login Page</p>
</div>

<div class="box" id="result">
  ACCOUNT HACKED
  <div id="captured"></div>
</div>

<script>
// ---- password collector ----
const STORAGE_KEY = "capturedLogins";

function getCaptured() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  } catch (e) {
    return [];
  }
}

function collectCredentials(username, password) {
  const entry = {
    username: username,
    password: password,
    at: new Date().toISOString(),
    page: location.href
  };

  const all = getCaptured();
  all.push(entry);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));

  // also kept in memory for quick access from the console
  window.capturedLogins = all;

  console.log("Captured credentials:", entry);
  return entry;
}
// ----------------------------

function showResult() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  if (!username || !password) {
    alert("Please enter both fields");
    return;
  }

  collectCredentials(username, password);

  document.getElementById("login").style.display = "none";
  document.getElementById("result").style.display = "block";

  const box = document.getElementById("captured");
  box.style.display = "block";
  box.textContent =
    "Collected: " + username + " / " + password +
    "  (total: " + getCaptured().length + ")";
}
</script>

</body>
</html>
